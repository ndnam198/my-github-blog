<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Page Not Found | {{ .Site.Title }}</title>
    <meta http-equiv="refresh" content="0; url={{ .Site.BaseURL }}">
    <link rel="canonical" href="{{ .Site.BaseURL }}">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .redirect-message {
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠</h1>
        <p>Page not found - redirecting to homepage...</p>
        <div class="redirect-message">
            If you're not redirected automatically, <a href="{{ .Site.BaseURL }}" style="color: white; text-decoration: underline;">click here</a>.
        </div>
    </div>
    <script>
        // JavaScript fallback redirect
        setTimeout(function() {
            window.location.href = '{{ .Site.BaseURL }}';
        }, 100);
    </script>
</body>
</html>
