<style>
/* Hover effects for social profile links */

}

}

.social-profile-links a:hover[href*="github"] {

}

.social-profile-links a:hover[href*="facebook"] {

  border-color: rgba(24, 119, 242, 0.6) !important;
}

.social-profile-links a:hover[href*="wa.me"] {

  border-color: rgba(37, 211, 102, 0.6) !important;
}

.social-profile-links a:hover[href*="mailto"] {
  background: rgba(234, 67, 53, 0.4) !important;
  border-color: rgba(234, 67, 53, 0.6) !important;
}

.social-profile-links a:hover[href*="tel"] {
  background: rgba(52, 168, 83, 0.4) !important;
  border-color: rgba(52, 168, 83, 0.6) !important;
}
</style>
