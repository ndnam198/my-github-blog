{{- /* Global CSS for animated gradient background and theme-adaptive styling */ -}}
<link rel="stylesheet" href="{{ "css/global-animations.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/dark-theme.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/light-theme.css" | relURL }}">

{{- /* Flying objects container and theme management */ -}}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const flyingContainer = document.createElement('div');
  flyingContainer.className = 'flying-objects';
  document.body.appendChild(flyingContainer);
  
  // Theme management for HTML class
  function updateHtmlTheme() {
    const isDark = document.body.classList.contains('dark');
    const html = document.documentElement;
    
    if (isDark) {
      html.classList.add('dark-mode');
      html.classList.remove('light-mode');
    } else {
      html.classList.add('light-mode');
      html.classList.remove('dark-mode');
    }
  }
  
  // Initial theme setup
  updateHtmlTheme();
  
  // Watch for theme changes
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
        updateHtmlTheme();
      }
    });
  });
  
  observer.observe(document.body, {
    attributes: true,
    attributeFilter: ['class']
  });
});
</script>
