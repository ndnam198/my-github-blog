baseURL = 'https://ndnam198.github.io/my-github-blog/'
languageCode = 'en-us'
title = "Nam's Homepage"
theme = "PaperMod"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  ShowPostsOnHomePage = false
  [params.homeInfoParams]
    Image = "/images/avatar.jpeg"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "About"
    url = "/"
    weight = 2