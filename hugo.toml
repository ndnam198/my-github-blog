baseURL = 'https://ndnam198.github.io/my-github-blog/'
languageCode = 'en-us'
title = "Nam's Homepage"
theme = "PaperMod"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  ShowPostsOnHomePage = false

# Enable custom 404 page
enableEmoji = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "Contacts"
    url = "/contacts"
    weight = 2

  [[menu.main]]
    name = "About"
    url = "/"
    weight = 3