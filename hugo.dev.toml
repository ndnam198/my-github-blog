baseURL = 'http://localhost:1313'
languageCode = 'en-us'
title = "Nam's Homepage"
theme = "PaperMod"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  ShowPostsOnHomePage = false
  # Force dark mode only
  defaultTheme = "dark"
  disableThemeToggle = true
  # Blog post settings
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  [params.homeInfoParams]
    Image = "/images/avatar.jpeg"

# Enable custom 404 page
enableEmoji = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "Projects"
    url = "/projects"
    weight = 2

  [[menu.main]]
    name = "Contacts"
    url = "/contacts"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/"
    weight = 4